# PomoFlow 同步服务 · 服务器端源码构建变体(不推荐日常使用)
#
# ⚠️ 用途:开发机上没有预编译二进制(bin/sync-server 缺失)时的兜底路径。
# ⚠️ 代价:首次构建需下载 Rust 工具链并编译全部依赖(5-15 分钟),
#         构建缓存 + 镜像层实测可占 10-20G 磁盘 —— 40G 小盘会被塞满!
#         2026-08-22 事故即由此引发。务必保证服务器 ≥30G 空闲磁盘再走本路径。
#
# 用法: docker compose -f docker-compose.build.yml up -d --build
# 日常请用默认的 docker-compose.yml(预编译路径,秒级、零缓存)。

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pomoflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pomoflow-dev}
      POSTGRES_DB: pomoflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432" # 仅本机调试用;公网部署删掉这一段
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pomoflow -d pomoflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  sync-server:
    build:
      context: ..            # 仓库根(需要完整 workspace 源码 + Cargo.lock)
      dockerfile: services/sync-server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pomoflow:${POSTGRES_PASSWORD:-pomoflow-dev}@postgres:5432/pomoflow
      SYNC_TOKEN: ${SYNC_TOKEN:?请在 .env 设置 SYNC_TOKEN}
      SYNC_USER_ID: ${SYNC_USER_ID:?请在 .env 设置 SYNC_USER_ID}
      PORT: "8080"
      # P1d 变量转发(与 docker-compose.yml 同步,见其注释)
      JWT_SECRET: ${JWT_SECRET:-}
      CODE_PEPPER: ${CODE_PEPPER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
