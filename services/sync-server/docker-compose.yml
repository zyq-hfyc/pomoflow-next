# PomoFlow 同步服务 · 开发环境(VMware Ubuntu / 腾讯云同用)
#
# 用法(默认走「预编译」路径:服务器上不做任何编译,build 只是拷贝二进制,秒级):
#   Windows 本地先产出二进制:  bash services/sync-server/build-local.sh
#   再打部署包:               bash services/sync-server/pack-deploy.sh
#   服务器解压后:
#     cp .env.example .env && 编辑 .env(至少改 SYNC_USER_ID / SYNC_TOKEN)
#     docker compose up -d --build
#
# 如需在服务器上从源码构建(不推荐:Rust 构建缓存实测可吃 10-20G 磁盘,
# 40G 小盘会被塞满导致系统故障;确需此路径务必保证 ≥30G 空闲磁盘):
#   docker compose -f docker-compose.build.yml up -d --build
#
# 公网部署(腾讯云)时:
#   - 移除 postgres 的 5432 端口映射(只留容器内网),或改绑 127.0.0.1
#   - 前置 nginx/caddy 做 HTTPS,SYNC_TOKEN 换强随机值

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pomoflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pomoflow-dev}
      POSTGRES_DB: pomoflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432" # 仅本机调试用;公网部署删掉这一段
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pomoflow -d pomoflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  sync-server:
    build:
      context: .            # = services/sync-server/,仅需 bin/sync-server 一个产物
      dockerfile: Dockerfile.prebuilt
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pomoflow:${POSTGRES_PASSWORD:-pomoflow-dev}@postgres:5432/pomoflow
      SYNC_TOKEN: ${SYNC_TOKEN:?请在 .env 设置 SYNC_TOKEN}
      SYNC_USER_ID: ${SYNC_USER_ID:?请在 .env 设置 SYNC_USER_ID}
      PORT: "8080"
      # P1d 账号体系变量转发(⚠️ compose 只把列在 environment 里的变量传进容器,
      # 漏转发会导致 .env 里配了 JWT_SECRET 但服务仍是 auth=static —— 2026-08-22
      # 实机部署踩坑,已在 VM 修复并回同步到仓库)。留空 = 功能关闭,语义不变。
      JWT_SECRET: ${JWT_SECRET:-}
      CODE_PEPPER: ${CODE_PEPPER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
