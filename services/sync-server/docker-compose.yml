# PomoFlow 同步服务 · 开发环境(VMware Ubuntu / 腾讯云同用)
#
# 用法:
#   cp .env.example .env && 编辑 .env(至少改 SYNC_USER_ID / SYNC_TOKEN)
#   docker compose up -d --build
#   桌面端(下一批接入)将指向 http://<本机局域网IP>:8080
#
# 公网部署(腾讯云)时:
#   - 移除 postgres 的 5432 端口映射(只留容器内网),或改绑 127.0.0.1
#   - 前置 nginx/caddy 做 HTTPS,SYNC_TOKEN 换强随机值

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pomoflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pomoflow-dev}
      POSTGRES_DB: pomoflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432" # 仅本机调试用;公网部署删掉这一段
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pomoflow -d pomoflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  sync-server:
    build:
      context: ..
      dockerfile: services/sync-server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pomoflow:${POSTGRES_PASSWORD:-pomoflow-dev}@postgres:5432/pomoflow
      SYNC_TOKEN: ${SYNC_TOKEN:?请在 .env 设置 SYNC_TOKEN}
      SYNC_USER_ID: ${SYNC_USER_ID:?请在 .env 设置 SYNC_USER_ID}
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
