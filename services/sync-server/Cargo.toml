[package]
name = "sync-server"
version = "0.1.0"
description = "PomoFlow 云端同步服务 —— Push/Pull + LWW 合并(与桌面共享 pomoflow-core)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "sync-server"
path = "src/main.rs"

[dependencies]
# 域模型 + LWW 合并(ADR-005:与桌面同一段代码,零漂移)
pomoflow-core = { path = "../../crates/core" }

# Web 框架(架构文档选型:axum + tokio)
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

# PostgreSQL(运行时查询,不用 query! 宏 → 编译期不需要 DATABASE_URL)。
# default-features 必须关:sqlx 默认特性含 sqlite,其 libsqlite3-sys 会与
# workspace 里 rusqlite(bundled)的原生链接冲突(同一 sqlite3 只能链一份)。
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }

# 序列化 / 时间 / ID
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# 认证(P1b,ADR-007):argon2 密码哈希 / JWT 签发校验 / refresh token 摘要 / 随机数
argon2 = "0.5"
jsonwebtoken = "9"
sha2 = "0.10"
rand = "0.8"
# P1d:邮箱验证码 HMAC 摘要(pepper 防 6 位码离线穷举)
hmac = "0.12"
# P1d 头像:base64 编解码(客户端传 JSON,免 multipart)
base64 = "0.22"
# P1d:SMTP 发信(rustls 免原生 OpenSSL;builder 组装纯文本邮件)
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "smtp-transport",
  "tokio1",
  "tokio1-rustls-tls",
] }

# 日志
log = { workspace = true }
env_logger = { workspace = true }
