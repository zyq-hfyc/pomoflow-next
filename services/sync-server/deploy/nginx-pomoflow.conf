# PomoFlow 生产 nginx 站点(腾讯云)—— 宿主机 :80 → 容器 127.0.0.1:8080。
# 当前无域名先用 IP,纯 HTTP(内测接受;域名 + TLS 是后续收敛点,骨架见文末)。
#
# 安装(Ubuntu,nginx 走 sites-enabled 布局):
#   sudo cp deploy/nginx-pomoflow.conf /etc/nginx/sites-available/pomoflow
#   sudo ln -sf /etc/nginx/sites-available/pomoflow /etc/nginx/sites-enabled/pomoflow
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 安全边界:
#   - `/internal/*` 直接 404:管理面端点(用户管理/发布上传)只允许本机回环
#     —— 运维操作 SSH 到服务器后 curl 127.0.0.1:8080,不过公网 nginx;
#     与容器侧只绑 127.0.0.1:8080 构成双保险
#   - 8080 / 5432 不加安全组公网规则(Docker 的 -p 绑 127.0.0.1 只挡宿主层,
#     云安全组才是公网边界,两层都要)
#   - `location /` 全量反代:官网静态、/api/public/*、/v1/* 同源,无需分块

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 安装包上传上限 —— 与 MAX_RELEASE_UPLOAD_BYTES(prod override 默认 1GiB)
    # 对齐;公网面只有下载,此值主要给未来 admin-bff 上云走 nginx 上传兜底
    client_max_body_size 1g;

    # 管理面不暴露公网(服务间通道仅回环可用)
    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 安装包下载是大文件流式响应,关缓冲直透
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# ---- HTTPS 骨架(有域名后启用) ------------------------------------------
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d <域名>          # 自动改写本文件加 443 + 跳转
#   证书续期由 certbot.timer 自动处理;启用后:
#   1. GitHub secret POMOFLOW_PROD_SERVER_URL 换 https://<域名>
#   2. 移动端 managed 包重新构建分发(烘焙地址切换)
#   3. 旧包用户经换服亲和复位自动迁移(见 apps/mobile/docs/RELEASE.md)
