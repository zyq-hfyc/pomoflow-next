[package]
name = "pomoflow-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "PomoFlow domain core: model + sync protocol + storage abstraction"

[lib]
name = "pomoflow_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# P1.5:`SqliteStore` 从 `apps/desktop` 搬进 core,migrate-v1 也需要。
# bundled 把 SQLite C 源码编进 binary,无需系统预装 libsqlite3。
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
serde_json = { workspace = true }
chrono = { workspace = true }