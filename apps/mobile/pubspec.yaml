name: pomoflow_mobile
description: "PomoFlow 移动端 —— Flutter + 本地优先 + 云端同步"
publish_to: 'none'
version: 0.2.0+2004

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  # Material 组件本地化(日期选择器年月/按钮文案等按 locale 展示)
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # REST 客户端
  http: ^1.2.0
  # JWT 安全存储(iOS Keychain / Android EncryptedSharedPreferences)
  flutter_secure_storage: ^9.2.2
  # 状态管理(轻量,项目复杂后再评估 Riverpod)
  provider: ^6.1.2
  # 非敏感配置(服务器地址)
  shared_preferences: ^2.3.2
  # 真机机型自报(Android brand+model / iOS name+model)
  device_info_plus: ^11.0.0
  # 本地数据库路径(用于 sqflite 落盘)
  path_provider: ^2.1.5
  # SQLite 客户端(数据层 P3d-Phase-1)
  sqflite: ^2.4.0
  # 路径拼接(用于 sqflite 数据库文件名;通常 path_provider 自带)
  path: ^1.9.0
  # 头像选择(相册/拍照)
  image_picker: ^1.1.2
  # 数据导出分享面板
  share_plus: ^10.1.4
  # 后台自动同步(Android WorkManager)
  workmanager: ^0.10.9
  # 本地通知提醒(番茄完成 / 休息结束)
  flutter_local_notifications: ^17.1.2
  # 结束时刻排程备用通知(应用被杀时兜底;随 flutter_local_notifications 传递依赖)
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1
  # 桌面图标生成(源图与桌面端 apps/desktop/icons/icon.png 同源)
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: false
  # Android 8+ 自适应图标:黑底 + 番茄前景(缩至 80% 留出裁切安全区)
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_adaptive_fg.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background: "#000000"
    theme_color: "#000000"

flutter:
  uses-material-design: true
