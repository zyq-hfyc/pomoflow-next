[package]
name = "pomoflow-desktop"
version = "0.1.0"
description = "PomoFlow 桌面端 —— Tauri 2 + Svelte 5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Tauri 2 桌面端产物(bin + lib);mobile entry 暂不开,desktop-only。
# Tauri 2 推荐 desktop-only 工程也用 lib + main 模式,以便后续切 mobile 时只加 mobile 入口。
[lib]
name = "pomoflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pomoflow-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# 复用 P0 域模型(同步协议 / Store trait / 业务校验)
pomoflow-core = { path = "../../crates/core" }

# Tauri 2 主框架
# - tray-icon:系统托盘(右键菜单 / 最小化到托盘)
# - image-png:从 PNG 字节加载 tray icon
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }

# Tauri 2 官方插件(P1.4 引入;dialog = 阶段 H xlsx 导出保存框)
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"

# 系统通知直发(与插件同一 Windows 后端,但 dev 下也显式带 AUMID,
# 否则回落 PowerShell 标识,通知签名显示"Windows PowerShell")
notify-rust = "4"
# AUMID 显示名写入 HKCU(免管理员注册通知签名)
winreg = "0.52"

# 同步客户端 HTTP 传输(P1a;rustls 避免原生 OpenSSL 依赖)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# 自动同步后台任务(P1b):手动/后台同步的串行化锁 + 定时 sleep
tokio = { version = "1", features = ["sync", "time"] }

# xlsx 导出(v1 ExcelJS 对应物;表头/标签由前端 i18n 传入,Rust 不做本地化)
rust_xlsxwriter = "0.79"

# 序列化(commands 桥接需要)
serde = { workspace = true }
serde_json = { workspace = true }

# 时间(ms ↔ chrono)
chrono = { workspace = true }

# 日志
log = { workspace = true }
env_logger = { workspace = true }

# 本阶段不引入的依赖(避免锁依赖):
# - tauri-plugin-* (notification/autostart/fs/dialog/store):P1.4 才加
# - tauri-plugin-sql:不打算用,直接 rusqlite 自写
# - sqlx:不打算用,race condition 没必要

[features]
# 默认开启;P1.2 / P1.4 阶段会按需扩展。
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
