name: ci

on:
  push:
    tags:
      - "v*"

# CI 触发策略:**只在我主动打 `v*` tag 时跑 CI**,push / PR 不再自动触发。
#
# 理由:本地用 `cargo check / test / clippy / fmt` 自我把关就够了,
# CI 留给发布闸 —— tag push 时同时跑本文件(crates/core 单元闸)与
# `release.yml`(Tauri 三平台打包占位 / P1.6 实装)。
#
# 阶段目标(P0):验证 crates/core 可编译 + 测试通过 + clippy 零警告。
# P1.6 阶段会在 release.yml 实装 Tauri 桌面端的 Windows / macOS / Linux matrix。

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check-core:
    name: cargo check (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
              ~/.cargo/registry
              ~/.cargo/git
              target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
              ${{ runner.os }}-cargo-

      - name: cargo check
        working-directory: crates/core
        run: cargo check --all-targets --locked

  test-core:
    name: cargo test (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
              ~/.cargo/registry
              ~/.cargo/git
              target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: cargo test
        working-directory: crates/core
        run: cargo test --all-targets --locked

  clippy-core:
    name: clippy (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
              ~/.cargo/registry
              ~/.cargo/git
              target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: cargo clippy
        working-directory: crates/core
        run: cargo clippy --all-targets --locked -- -D warnings

  fmt:
    name: rustfmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check