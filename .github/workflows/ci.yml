name: ci

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch: {}

# CI 触发策略(2026-09-04 修订):**push main 即跑全仓门禁**。
#
# 旧策略(08-16,单 crate 时代)是「只在打 v* tag 时跑,平时本地自我把关」。
# 此后仓库长成 4 个 cargo crate(core / desktop / migrate-v1 / sync-server)
# + Flutter 移动端 + Svelte UI,本地门禁出现已知硬伤:Windows 上 WinLibs
# dlltool 触发文件系统 1006 错误,cargo test 跑不全(见 CLAUDE.md)——
# 问题要拖到打 tag 那天才在 CI 暴露。Ubuntu runner 全量跑,顺带根治;
# tag 触发保留(与 release.yml 三平台打包互锁),另加 workflow_dispatch
# 供手动重跑。
#
# 覆盖(5 job):
#   rust fmt / clippy / test —— workspace 全 4 crate,test 是本 CI 的核心增量
#   ui —— svelte-check(错误级)+ tsc --noEmit + vite build
#   mobile —— flutter analyze(零 issue)+ flutter test(单测,sqflite ffi)

concurrency:
  # 同分支连续 push 时旧的自动取消(省 CI 额度)
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: Linux-cargo-clippy-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            Linux-cargo-clippy-

      # desktop crate 链接 Tauri,Ubuntu runner 需装 webkit2gtk 等系统库
      # (清单 crib 自 release.yml 的 Linux 平台步骤)
      - name: Install Linux system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # tauri::generate_context! 在编译期校验 frontendDist(./ui/dist)存在,
      # 目录缺失直接 proc-macro panic。ui/dist 已 gitignore,干净检出的
      # runner 上必须先造出来(占位即可 —— 真 UI 产物由 ui job 单独门禁,
      # rust job 只编译不跑 webview;本地能过是因为有构建残留)。
      - name: Placeholder ui/dist for generate_context!
        working-directory: apps/desktop
        run: |
          mkdir -p ui/dist
          echo '<!doctype html><title>pomoflow</title>' > ui/dist/index.html

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: Linux-cargo-test-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            Linux-cargo-test-

      - name: Install Linux system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # 同 clippy job:generate_context! 编译期要求 ui/dist 存在(见上)
      - name: Placeholder ui/dist for generate_context!
        working-directory: apps/desktop
        run: |
          mkdir -p ui/dist
          echo '<!doctype html><title>pomoflow</title>' > ui/dist/index.html

      # core 99 + desktop 7 + server 9 + migrate-v1 —— Windows 本地跑不了的那份
      - name: cargo test
        run: cargo test --all-targets --locked

  ui:
    name: desktop UI (svelte-check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - name: npm ci
        working-directory: apps/desktop/ui
        run: npm ci

      # svelte-check 只对 error 级退出非零;0 警告是本地约定,不在此强制
      - name: svelte-check
        working-directory: apps/desktop/ui
        run: npm run check

      # build 脚本 = tsc --noEmit && vite build,两道都在内
      - name: tsc + vite build
        working-directory: apps/desktop/ui
        run: npm run build

  mobile:
    name: mobile (flutter analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true

      # sqflite_common_ffi 运行时 dlopen libsqlite3(runner 一般预装,防兜底)
      - name: Ensure libsqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0

      - name: flutter pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: flutter analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: flutter test
        working-directory: apps/mobile
        run: flutter test
